<svg width="96" height="96" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- A board: three columns of cards, and the gap where one is not.

       The gap is the mark. Cards in every slot is a grid; cards in five of six
       slots is a board somebody has been moving things around on, which is what
       the control is for.

       The ramp is the PCFHub mark's own, verbatim, so this sits in the family rather
       than beside it. Declared in userSpaceOnUse and spanning the whole 96
       canvas, so the mark reads as one object lit from the top right.

       Drawn for 32px, and two attempts came first. Three bare columns with a
       card in each, no frame, is an EQUALIZER at 32: the columns read as level
       meters and the white blocks as their caps. Adding column headers and
       letting the fills run to different heights made it a bar chart instead.
       Putting the columns inside the board's own frame, and keeping every card
       the same size so only their presence varies, is what stopped the mark
       being read as a measurement.

       Note: no double hyphen may appear in this comment, or the whole document
       fails to parse as XML. -->
  <defs>
    <linearGradient id="kanban-board-ramp" x1="6" y1="82" x2="90" y2="14" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A684FF"/><stop offset="0.6" stop-color="#7C86FF"/><stop offset="1" stop-color="#00BCFF"/>
    </linearGradient>
  </defs>
  <!-- The board. -->
  <rect x="6" y="14" width="84" height="68" rx="16" fill="url(#kanban-board-ramp)"/>

  <!-- The cards. Identical, so the empty slot is the only variable. -->
  <rect x="17" y="26" width="18" height="16" rx="5" fill="#F8FAFC"/>
  <rect x="17" y="48" width="18" height="16" rx="5" fill="#F8FAFC"/>
  <rect x="39" y="26" width="18" height="16" rx="5" fill="#F8FAFC"/>
  <rect x="61" y="26" width="18" height="16" rx="5" fill="#F8FAFC"/>
  <rect x="61" y="48" width="18" height="16" rx="5" fill="#F8FAFC"/>
</svg>
